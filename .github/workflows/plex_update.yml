name: Actualizar Plex España

on:
  schedule:
    - cron: "37 */4 * * *"

  workflow_dispatch:

  push:
    paths:
      - "plex_provider.py"
      - ".github/workflows/plex_update.yaml"

permissions:
  contents: write

concurrency:
  group: plex-es-update
  cancel-in-progress: true

jobs:
  update-plex:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generar lista Plex
        run: |
          python plex_provider.py

      - name: Comprobar lista
        run: |
          test -s plex_es.m3u
          grep -q '^#EXTM3U' plex_es.m3u
          grep -q '^#EXTINF:' plex_es.m3u
          grep -q 'X-Plex-Token=' plex_es.m3u

          CHANNELS=$(grep -c '^#EXTINF:' plex_es.m3u)

          echo "Canales generados: $CHANNELS"

          if [ "$CHANNELS" -lt 1 ]; then
            echo "No se han generado canales."
            exit 1
          fi

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add plex_es.m3u

          if git diff --cached --quiet; then
            echo "La lista no ha cambiado."
          else
            git commit -m "Actualizar lista Plex España"
            git push
          fi
