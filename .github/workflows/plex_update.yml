name: Update Plex Spain

on:
  schedule:
    - cron: '37 */4 * * *'

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'plex_provider.py'
      - '.github/workflows/plex_update.yml'

permissions:
  contents: write

concurrency:
  group: plex-spain
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Plex Spain playlist
        run: python plex_provider.py

      - name: Validate Plex playlist
        run: |
          set -e

          test -s plex_es.m3u

          grep -q '^#EXTM3U' plex_es.m3u
          grep -q '^#EXTINF' plex_es.m3u
          grep -q 'X-Plex-Token=' plex_es.m3u

          CHANNELS=$(grep -c '^#EXTINF' plex_es.m3u)
          URLS=$(grep -c 'X-Plex-Token=' plex_es.m3u)

          if [ "$CHANNELS" -ne "$URLS" ]; then
            echo "ERROR: No coinciden canales y URLs"
            exit 1
          fi

          echo "Plex España validado"
          echo "Canales: $CHANNELS"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add plex_es.m3u

          if ! git diff --cached --quiet; then
            git commit -m "Update Plex Spain"
            git push
          else
            echo "No changes"
          fi
