
name: Update Pluto Spain

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'pluto_provider.py'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: pluto-spain
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Generate Spain playlist
        run: python pluto_provider.py

      - name: Validate playlist
        run: |
          test -s pluto_es.m3u
          grep -q '^#EXTINF' pluto_es.m3u
          grep -q 'https://jmp2.uk/plu-' pluto_es.m3u

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pluto_es.m3u

          if ! git diff --cached --quiet; then
            git commit -m "Update Pluto Spain"
            git push
          else
            echo "No changes"
          fi
