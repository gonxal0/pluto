
name: Update Pluto Spain

on:
  schedule:
    - cron: '17 */4 * * *'

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'pluto_provider.py'
      - '.github/workflows/pluto_update.yml'

permissions:
  contents: write

concurrency:
  group: pluto-spain
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Spain playlist
        run: python pluto_provider.py

      - name: Validate playlist
        run: |
          set -e

          test -s pluto_es.m3u
          grep -q '^#EXTM3U' pluto_es.m3u
          grep -q '^#EXTINF' pluto_es.m3u
          grep -q 'master.m3u8?jwt=' pluto_es.m3u

          if grep -q 'jmp2.uk' pluto_es.m3u; then
            echo "ERROR: Se han encontrado URLs antiguas jmp2.uk"
            exit 1
          fi

          echo "Playlist directa validada"
          echo "Canales: $(grep -c '^#EXTINF' pluto_es.m3u)"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pluto_es.m3u

          if ! git diff --cached --quiet; then
            git commit -m "Update Pluto Spain"

            # La rama puede haber recibido cambios mientras se generaba la lista.
            # Reaplicar el commit de la M3U sobre la última versión remota.
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"

            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No changes"
          fi
